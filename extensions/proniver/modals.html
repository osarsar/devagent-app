<!-- New Client Modal -->
<div class="modal" id="new-client-modal" style="min-width:420px">
    <h3>Nouveau client Proniver</h3>
    <div class="form-group"><label>Reference</label><input class="form-input" id="nc-ref" placeholder="PRN-26-XXXX" style="font-family:monospace"></div>
    <div class="form-group"><label>Nom de l'etablissement</label><input class="form-input" id="nc-nom" placeholder="Restaurant Le Maarif"></div>
    <div class="grid-2" style="margin-bottom:0">
        <div class="form-group"><label>Quartier</label><input class="form-input" id="nc-quartier" placeholder="Maarif"></div>
        <div class="form-group"><label>Telephone</label><input class="form-input" id="nc-tel" placeholder="+212 6XX XXX XXX"></div>
    </div>
    <div class="grid-2" style="margin-bottom:0">
        <div class="form-group"><label>Scoring</label>
            <select class="form-input" id="nc-scoring"><option>A</option><option selected>B</option><option>C</option></select>
        </div>
        <div class="form-group"><label>Pack</label>
            <select class="form-input" id="nc-pack"><option>P1</option><option value="P2" selected>P2</option><option>P3</option><option>P4</option></select>
        </div>
    </div>
    <div class="modal-actions">
        <button class="btn" onclick="closeModals()">Annuler</button>
        <button class="btn btn-primary" onclick="pnvCreateClient()">Creer</button>
    </div>
</div>
