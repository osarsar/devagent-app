        <!-- ════ WORKSPACE ════ -->
        <div id="page-workspace" class="page">
            <div class="flex-between mb-12">
                <div class="flex gap-6" style="align-items:center">
                    <div class="section-title" id="ws-title" style="margin-bottom:0"></div>
                    <select id="ws-project-select" class="form-input ws-project-select" title="Changer de projet" onchange="openWorkspace(parseInt(this.value))"></select>
                </div>
                <div class="flex gap-6">
                    <button class="btn btn-sm" id="ws-ctrl-btn" onclick="launchProjectConsole(wsProjectId)" style="display:none;border-color:var(--sky);color:var(--sky)"></button>
                    <button class="btn btn-sm" onclick="go('projects')">&#8592; Projets</button>
                    <button class="btn btn-sm" id="ws-copy-prompt" onclick="wsCopyPrompt()" style="display:none">Copier Prompt</button>
                </div>
            </div>
            <!-- Detect banner for projects without profile -->
            <div id="ws-model-bar" style="display:none;margin-bottom:10px;padding:8px 14px;border-radius:8px;background:var(--bg-2);border:1px solid var(--border-0);align-items:center;justify-content:space-between;gap:8px"></div>
            <div id="ws-running-bar" style="display:none;margin-bottom:10px;padding:6px 14px;border-radius:8px;background:rgba(16,185,129,.05);border:1px solid rgba(16,185,129,.25);align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"></div>
            <div id="ws-phase-line" class="phase2" style="display:none"></div>
            <div id="ws-github-banner" style="display:none;margin-bottom:10px;padding:10px 14px;border-radius:8px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);align-items:center;justify-content:space-between">
                <span style="font-size:12px;color:var(--text-1)">Ce projet n'est pas encore lie a GitHub.</span>
                <button class="btn btn-xs btn-primary" onclick="openLinkTerminal(wsProjectId)">Lier a GitHub</button>
            </div>
            <div id="ws-detect-banner" style="display:none;margin-bottom:10px;padding:10px 14px;border-radius:8px;background:rgba(109,92,255,.08);border:1px solid rgba(109,92,255,.2);align-items:center;justify-content:space-between">
                <span style="font-size:12px;color:var(--text-1)">Ce projet n'a pas de profil configure. DevAgent peut detecter automatiquement les composants.</span>
                <button class="btn btn-primary btn-sm" onclick="wsDetectComponents()" style="flex-shrink:0;margin-left:12px">Detecter</button>
            </div>
            <div class="workspace">
                <!-- Left: Tabs + Panels -->
                <div class="ws-left">
                    <div class="ws-tabs-wrap" id="ws-tabs-wrap"><div class="ws-tabs" id="ws-tabs-container">
                        <div class="ws-tab active" onclick="wsTab('checklist')">Checklist</div>
                        <div class="ws-tab" onclick="wsTab('sessions')">Sessions</div>
                        <div class="ws-tab" onclick="wsTab('git')">Git</div>
                        <div class="ws-tab" onclick="wsTab('cloud')">Cloud</div>
                        <div class="ws-tab" onclick="wsTab('info')">Infos</div>
                        <div class="ws-tab" onclick="wsTab('prompt')">Prompt</div></div>
                    </div>
                    <div class="ws-panel" id="ws-agent"></div>
                    <div class="ws-panel active" id="ws-dev"></div>
                    <div class="ws-panel" id="ws-roadmap"></div>
                    <div class="ws-panel" id="ws-checklist"></div>
                    <div class="ws-panel" id="ws-sessions"></div>
                    <div class="ws-panel" id="ws-connections"></div>
                    <div class="ws-panel" id="ws-git"></div>
                    <div class="ws-panel" id="ws-cloud"></div>
                    <div class="ws-panel" id="ws-info"></div>
                    <div class="ws-panel" id="ws-automatisations"></div>
                    <div class="ws-panel" id="ws-carte"></div>
                    <div class="ws-panel" id="ws-prompt"></div>
                </div>
                <!-- Right: Terminal integrated + external buttons -->
                <div class="ws-right" style="display:flex;flex-direction:column">
                    <div class="ws-term-header">
                        <div class="ws-views">
                            <button class="ws-view-btn on" data-view="etat" onclick="wsView('etat')" title="L'etat du projet : local, en ligne, code, actions de l'agent">Etat</button>
                            <button class="ws-view-btn" data-view="local" onclick="wsView('local')" title="Le site que tu developpes, sur ce PC">Local</button>
                            <button class="ws-view-btn" data-view="ligne" onclick="wsView('ligne')" title="Le site que voient tes visiteurs">En ligne</button>
                        </div>
                    </div>
                    <div id="ws-xterm" style="display:none"></div>
                    <div id="ws-etat" style="flex:1;overflow:auto"></div>
                    <div id="ws-ligne" style="display:none;flex:1;flex-direction:column;min-height:0">
                        <div class="ws-prev-bar" id="ws-ligne-bar"></div>
                        <div class="ws-prev-body" id="ws-ligne-body"></div>
                    </div>
                    <div id="ws-preview" style="display:none;flex:1;flex-direction:column;min-height:0">
                        <div class="ws-prev-bar" id="ws-prev-bar"></div>
                        <div class="ws-prev-body" id="ws-prev-body"></div>
                    </div>
                </div>
            </div>
        </div>
